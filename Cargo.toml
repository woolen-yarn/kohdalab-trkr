[workspace]
members = ["crates/trkr-core", "crates/trkr-transport", "crates/trkr-motion", "crates/trkr-desktop", "crates/kohdalab-control-protocol"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Preserve the original f64 when re-reading raw/provenance JSON and API values.
serde_json = { version = "1", features = ["float_roundtrip"] }
trkr-core = { path = "crates/trkr-core" }
trkr-transport = { path = "crates/trkr-transport" }
trkr-motion = { path = "crates/trkr-motion" }
kohdalab-control-protocol = { path = "crates/kohdalab-control-protocol" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
overflow-checks = true
