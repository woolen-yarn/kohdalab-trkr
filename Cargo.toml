[workspace]
members = ["crates/trkr-core", "crates/trkr-transport", "crates/trkr-motion", "crates/trkr-desktop", "crates/kohdalab-control-protocol"]
resolver = "3"

[workspace.package]
version = "1.0.6"
edition = "2024"
license = "MIT"
rust-version = "1.95"

# Every member opts in with `[lints] workspace = true`. Unsafe code is denied by
# default; the only exemptions are narrow, item-level `#[allow(unsafe_code)]`
# on documented Windows FFI (Thorlabs TLPM/TLPMX driver loading and the demo
# launcher's MessageBoxW). Clippy stays strict through `-D warnings` in CI.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Preserve the original f64 when re-reading raw/provenance JSON and API values.
serde_json = { version = "1", features = ["float_roundtrip"] }
trkr-core = { path = "crates/trkr-core" }
trkr-transport = { path = "crates/trkr-transport" }
trkr-motion = { path = "crates/trkr-motion" }
kohdalab-control-protocol = { path = "crates/kohdalab-control-protocol" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
overflow-checks = true
