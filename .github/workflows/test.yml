name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Isolate Rust toolchain installation
        shell: bash
        run: |
          toolchain_dir=$(mktemp -d "$RUNNER_TEMP/kohdalab-rustup.XXXXXX")
          echo "RUSTUP_HOME=$toolchain_dir" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for the thin notebook bridge checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Python test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install Linux GUI build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Locate Windows resource compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter rc.exe |
            Where-Object { $_.FullName -match '\\x64\\rc.exe$' } |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $rc) { throw 'Windows resource compiler rc.exe was not found.' }
          "RC=$($rc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Common GUI control SDK (device-free)
        run: python -m unittest discover -s bindings/control -p "test_*.py" -v
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path Cargo.toml --all --check
      - name: Lint Rust workspace
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets --locked -- -D warnings
      # Authoritative note for the macOS split below.
      # engine::tests::monitor_hands_off_every_connected_axis_and_records_no_position
      # is #[cfg(unix)], so it runs on Linux and macOS only (Windows has no such
      # case). It asserts that every Signal Monitor read stays within 50 ms of
      # its 0.1 s schedule while simulated delay/scanner moves run concurrently.
      # On hosted macOS runners, contention from the rest of the parallel suite
      # can delay thread scheduling beyond that budget, so macOS skips it in the
      # workspace run and re-runs it alone with --exact. Isolation reduces that
      # scheduler contention but cannot eliminate it: the isolated run can still
      # occasionally fail on delayed runner scheduling. The assertion and its
      # timing budget are deliberately unchanged; Linux runs it in the normal
      # parallel suite.
      - name: Test Rust workspace
        if: runner.os != 'macOS'
        run: cargo test --manifest-path Cargo.toml --workspace --locked
      - name: Test Rust workspace without concurrent timing assertion on macOS
        if: runner.os == 'macOS'
        run: >-
          cargo test --manifest-path Cargo.toml --workspace --locked --
          --skip engine::tests::monitor_hands_off_every_connected_axis_and_records_no_position
      - name: Test isolated Signal Monitor timing on macOS
        if: runner.os == 'macOS'
        run: >-
          cargo test --manifest-path Cargo.toml --locked --bin kohdalab-trkr
          engine::tests::monitor_hands_off_every_connected_axis_and_records_no_position -- --exact
      - name: Test actual GUI interactions without hardware
        run: cargo test --manifest-path Cargo.toml --locked --features gui-interaction-tests --bin kohdalab-trkr ui::gui_interaction_tests::tests
      - name: Test optional development diagnostics without hardware
        if: runner.os == 'Linux'
        run: cargo test --manifest-path Cargo.toml --locked --features dev-diagnostics --bin kohdalab-trkr
      - name: Build controller for notebook integration checks
        run: cargo build --manifest-path Cargo.toml --bin kohdalab-trkr --locked
      - name: Test packaging, bridge, and layout checks
        run: python -m pytest tests

  minimum-rust:
    # The workspace `rust-version` is a claim, so verify it against Cargo.lock.
    # The pinned default toolchain in rust-toolchain.toml is left untouched;
    # only this job overrides it with `cargo +<rust-version>`.
    name: Minimum supported Rust (locked)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Isolate Rust toolchain installation
        shell: bash
        run: |
          toolchain_dir=$(mktemp -d "$RUNNER_TEMP/kohdalab-rustup.XXXXXX")
          echo "RUSTUP_HOME=$toolchain_dir" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux GUI build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Install the declared minimum Rust toolchain
        shell: bash
        run: |
          msrv=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo 'Workspace rust-version was not found in Cargo.toml.' >&2
            exit 1
          fi
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
      - name: Check workspace with locked dependencies on the minimum Rust
        run: cargo "+$MSRV" check --manifest-path Cargo.toml --workspace --all-targets --all-features --locked
      - name: Test workspace with locked dependencies on the minimum Rust
        run: cargo "+$MSRV" test --manifest-path Cargo.toml --workspace --locked

  dependency-audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check locked dependencies against RustSec
        run: cargo audit --file Cargo.lock --deny unsound
