name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python for the thin notebook bridge checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Python test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install Linux GUI build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Locate Windows resource compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter rc.exe |
            Where-Object { $_.FullName -match '\\x64\\rc.exe$' } |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $rc) { throw 'Windows resource compiler rc.exe was not found.' }
          "RC=$($rc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path Cargo.toml --all --check
      - name: Lint Rust workspace
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --manifest-path Cargo.toml --workspace --locked
      - name: Build controller for notebook integration checks
        run: cargo build --manifest-path Cargo.toml --bin kohdalab-trkr --locked
      - name: Test packaging, bridge, and layout checks
        run: python -m pytest tests
