[package]
name = "kohdalab-trkr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "kohdalab-trkr"
build = "build.rs"

[lints]
workspace = true

[dependencies]
trkr-core.workspace = true
trkr-transport.workspace = true
trkr-motion.workspace = true
kohdalab-control-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
# eframe 0.37 made the clipboard optional; enable it explicitly so text
# fields keep native copy/paste with `default-features = false`. The
# `inspection` feature (remote inspection server) is intentionally not enabled.
eframe = { version = "^0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit", "clipboard"] }
# Feature unifier only (code uses `eframe::egui`): egui 0.37 no longer bundles
# the emoji/symbol fallback that egui 0.34 shipped by default, which toast
# icons such as "ℹ" need. This restores that same fallback font set.
egui = { version = "^0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_plot = "^0.38.0"
csv = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
time = { version = "0.3.47", features = ["formatting", "parsing"] }

tempfile = "3"
read-fonts = "0.39"

[[bin]]
name = "kohdalab-trkr"
path = "src/main.rs"

[[bin]]
name = "kohdalab-trkr-demo"
path = "src/demo_launcher.rs"

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.18.0", default-features = false }

[features]
# Optional development diagnostics (puffin scope, headless real-app harness tests,
# icon comparison switch); disabled in distribution builds.
dev-diagnostics = ["dep:puffin"]
# Hardware-free GUI interaction tests; disabled in distribution builds.
gui-interaction-tests = []

[dependencies.puffin]
version = "=0.20.0"
optional = true

[dev-dependencies]
egui_kittest = { version = "=0.37.0", default-features = false, features = ["eframe"] }

[dependencies.egui-notify]
version = "=0.24.0"
