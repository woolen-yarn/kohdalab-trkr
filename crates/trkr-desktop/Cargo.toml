[package]
name = "kohdalab-trkr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "kohdalab-trkr"
build = "build.rs"

[dependencies]
trkr-core.workspace = true
trkr-transport.workspace = true
trkr-motion.workspace = true
kohdalab-control-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
egui_plot = "0.34"
csv = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
time = { version = "0.3", features = ["formatting"] }

tempfile = "3"
ttf-parser = "0.25"

[[bin]]
name = "kohdalab-trkr"
path = "src/main.rs"

[[bin]]
name = "kohdalab-trkr-demo"
path = "src/demo_launcher.rs"
